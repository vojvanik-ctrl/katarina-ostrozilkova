return data?.schemaVersion===1&&typeof data.name==='string'&&data.name.trim().length>0&&typeof data.studyProgram==='string'&&data.studyProgram.trim().length>0&&typeof data.bio==='string'&&[...data.bio].length<=180&&(data.countryCode===null||/^[A-Z]{2}$/.test(data.countryCode))&&(data.portfolioUrl===null||(typeof data.portfolioUrl==='string'&&data.portfolioUrl.startsWith('https://')))&&imagePath(data.photoOriginal)&&imagePath(data.photoStamp);
}

if(id==='cv')return `<article class="simple-sheet paper cv-sheet" aria-labelledby="cv-title">

}
function render(index){
const id=PAGES[index],focusWasInPage=page.contains(document.activeElement)||(mobile.matches&&$('nav').contains(document.activeElement));state.current=index;state.playing=false;state.playhead=0;cancelAnimationFrame(previewFrame);
page.className='page '+(id==='home'?'home':id==='portfolio'?'portfolio-page':['g18','raiders','props'].includes(id)?'detail-page':'simple-page');
page.innerHTML=view(id);viewport.scrollTop=0;
document.querySelectorAll('.nav-link').forEach(b=>{const active=b.dataset.page===(['g18','raiders','props'].includes(id)?'portfolio':id);b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
$('announcement').textContent=TITLES[id];document.title=TITLES[id]+' · '+PROFILE.name;
updateReadout();updateTransport();closeMenu(false);if(focusWasInPage)page.querySelector('h1')?.focus({preventScroll:true});page.classList.remove('page-enter');void page.offsetWidth;page.classList.add('page-enter');
}
function updateReadout(){const n=String(state.target+1).padStart(2,'0');$('channel-readout').textContent=n;$('screen-channel').textContent='CH '+n;}
function pulse(button){button.classList.remove('pushed');void button.offsetWidth;button.classList.add('pushed');setTimeout(()=>button.classList.remove('pushed'),420);}
function drawSnow(time){
if(!state.powered||time>noiseDeadline){cancelAnimationFrame(noiseFrame);noiseFrame=0;return;}
if(time-lastNoise>65){lastNoise=time;const data=ctx.createImageData(canvas.width,canvas.height),p=data.data;for(let i=0;i<p.length;i+=4){const gray=20+Math.floor(Math.random()*175);p[i]=p[i+1]=p[i+2]=gray;p[i+3]=255;}ctx.putImageData(data,0,0);const y=(time*.42)%canvas.height;ctx.fillStyle='#333333aa';ctx.fillRect(0,y,canvas.width,4);ctx.fillStyle='#aaaaaa44';ctx.fillRect(0,(y+9)%canvas.height,canvas.width,2);}
noiseFrame=requestAnimationFrame(drawSnow);
}
function startSnow(ms){if(reduced.matches)return;const rect=screen.getBoundingClientRect();canvas.width=Math.max(60,Math.round(Math.min(420,rect.width/2.6)));canvas.height=Math.max(60,Math.round(Math.min(280,rect.height/2.6)));noiseDeadline=performance.now()+ms;lastNoise=0;cancelAnimationFrame(noiseFrame);noiseFrame=requestAnimationFrame(drawSnow);}
function playTuningSound(){
if(!state.volume||!state.powered||reduced.matches)return;
try{audioContext??=new (window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const seconds=.16,buffer=audioContext.createBuffer(1,Math.floor(audioContext.sampleRate*seconds),audioContext.sampleRate),samples=buffer.getChannelData(0);for(let i=0;i<samples.length;i++)samples[i]=(Math.random()*2-1)*.5;const source=audioContext.createBufferSource(),gain=audioContext.createGain(),filter=audioContext.createBiquadFilter();filter.type='lowpass';filter.frequency.value=2000;source.buffer=buffer;gain.gain.setValueAtTime(state.volume===1?.035:.075,audioContext.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+seconds);source.connect(filter).connect(gain).connect(audioContext.destination);source.start();}catch{}
}

function updateMusicControls(){
const on=state.volume>0,playing=on&&state.powered&&!document.hidden;
$('volume-rotor').style.setProperty('--angle',(on?25:-100)+'deg');$('sound-state').textContent=on?'SOUND ON':'SOUND OFF';$('volume-unit').classList.toggle('sound-enabled',playing);
$('volume-knob').setAttribute('aria-pressed',String(on));$('volume-knob').setAttribute('aria-label',on?'Turn background music off':'Turn background music on');$('volume-knob').title=on?'Turn background music off':'Turn background music on';
$('music-power').textContent=on?'Turn music off':'Turn music on';$('music-status').textContent=playing?'Playing: '+TRACKS[state.soundtrack].title:on?'Music paused':'Music off';
document.querySelectorAll('[data-soundtrack]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.soundtrack===state.soundtrack)));
}
function syncMusic(){
const request=++musicRequest;updateMusicControls();
if(!state.volume||!state.powered||document.hidden){musicPlayer.pause();return;}
const track=TRACKS[state.soundtrack];if(musicPlayer.getAttribute('src')!==track.src){musicPlayer.src=track.src;musicPlayer.load();}
musicPlayer.volume=.12;
musicPlayer.play().then(()=>{if(request!==musicRequest){if(!state.volume||!state.powered||document.hidden)musicPlayer.pause();return;}updateMusicControls();}).catch(error=>{if(request!==musicRequest||error.name==='AbortError')return;state.volume=0;updateMusicControls();$('music-status').textContent='Tap a soundtrack to try again.';$('announcement').textContent='Music could not start. Tap a soundtrack to try again.';});
}
function toggleMusic(){if(!state.powered)return;state.volume=state.volume?0:1;syncMusic();}
function chooseSoundtrack(key){if(!TRACKS[key]||!state.powered)return;state.soundtrack=key;state.volume=1;syncMusic();}
function closeSoundSettings(restoreFocus=true){if($('sound-panel').hidden)return;$('sound-panel').hidden=true;document.querySelectorAll('[data-music-settings]').forEach(b=>b.setAttribute('aria-expanded','false'));if(restoreFocus&&musicOpener?.isConnected)musicOpener.focus();}
function openSoundSettings(button){if(!state.powered)return;if(!$('sound-panel').hidden){closeSoundSettings();return;}closeMenu(false);musicOpener=button;$('sound-panel').hidden=false;document.querySelectorAll('[data-music-settings]').forEach(b=>b.setAttribute('aria-expanded','true'));$('sound-panel').querySelector('[data-soundtrack="'+state.soundtrack+'"]').focus();}
function updateBackgroundMotion(){
tv.classList.toggle('motion-paused',state.motionPaused||reduced.matches||document.hidden||!state.powered);
const button=$('motion-toggle');button.disabled=reduced.matches;button.setAttribute('aria-pressed',String(!state.motionPaused&&!reduced.matches));button.textContent=reduced.matches?'Background motion reduced':state.motionPaused?'Resume background motion':'Pause background motion';
}
musicPlayer.addEventListener('error',()=>{if(!state.volume)return;state.volume=0;updateMusicControls();$('music-status').textContent='This soundtrack is unavailable.';});
document.querySelectorAll('[data-music-settings]').forEach(b=>b.addEventListener('click',()=>openSoundSettings(b)));
document.querySelectorAll('[data-soundtrack]').forEach(b=>b.addEventListener('click',()=>chooseSoundtrack(b.dataset.soundtrack)));
$('sound-close').addEventListener('click',()=>closeSoundSettings());$('music-power').addEventListener('click',toggleMusic);
$('motion-toggle').addEventListener('click',()=>{state.motionPaused=!state.motionPaused;updateBackgroundMotion();});
document.addEventListener('click',e=>{if(!$('sound-panel').hidden&&!e.target.closest('#sound-panel')&&!e.target.closest('[data-music-settings]'))closeSoundSettings(false);});

function navigate(index,direction=1){
if(!state.powered)return;index=(index+PAGES.length)%PAGES.length;if(index===state.target)return;
state.target=index;state.angle+=direction*30;$('channel-rotor').style.setProperty('--angle',state.angle+'deg');$('channel-knob').classList.add('tuned');setTimeout(()=>$('channel-knob').classList.remove('tuned'),650);updateReadout();pulse($(direction<0?'side-previous':'side-next'));
if(state.busy)return;
if(reduced.matches){render(state.target);return;}
state.busy=true;const token=++state.token;tv.classList.remove('booting');tv.classList.add('tuning');viewport.setAttribute('aria-busy','true');startSnow(550);playTuningSound();
setTimeout(()=>{if(token!==state.token||!state.powered)return;render(state.target);},190);
setTimeout(()=>{if(token!==state.token||!state.powered)return;if(state.current!==state.target)render(state.target);tv.classList.remove('tuning');viewport.setAttribute('aria-busy','false');state.busy=false;},470);
}
function updateTransport(){
const preview=PAGES[state.target]==='animation';
for(const side of ['previous','next']){
const label=preview?(side==='previous'?'Back 5s':'Skip 5s'):(side==='previous'?'Previous':'Next');
$(side+'-label').textContent=label;$('side-'+side+'-label').textContent=label;
for(const id of [side,'side-'+side]){const description=preview?(side==='previous'?'Seek preview backward 5 seconds':'Seek preview forward 5 seconds'):(side==='previous'?'Previous page':'Next page');$(id).setAttribute('aria-label',description);$(id).title=description;}
}
}
function paintPreview(){const player=$('forest-player');if(!player)return;player.style.backgroundPosition=(35+state.playhead*1.5)+'% 50%';$('preview-seek').value=state.playhead;$('preview-seek').setAttribute('aria-valuetext',Math.round(state.playhead)+' seconds of 20 seconds');$('preview-time').textContent='0:'+String(Math.floor(state.playhead)).padStart(2,'0')+' / 0:20';}
function animatePreview(time){if(!state.playing||!state.powered||document.hidden)return;if(previewLast)state.playhead=Math.min(20,state.playhead+(time-previewLast)/1000);previewLast=time;paintPreview();if(state.playhead>=20){togglePreview(false);return;}previewFrame=requestAnimationFrame(animatePreview);}
function togglePreview(force){if(!state.powered||!$('forest-player'))return;state.playing=typeof force==='boolean'?force:!state.playing;if(state.playing&&state.playhead>=20)state.playhead=0;cancelAnimationFrame(previewFrame);previewLast=0;$('play-pause').textContent=state.playing?'❚❚ Pause preview':'▶ Play preview';$('play-pause').setAttribute('aria-pressed',String(state.playing));$('playback-status').textContent=state.playing?'PLAYING':'PAUSED';if(state.playing)previewFrame=requestAnimationFrame(animatePreview);paintPreview();}
function step(direction){if(!state.powered)return;if(PAGES[state.current]==='animation'&&!state.busy){state.playhead=Math.max(0,Math.min(20,state.playhead+direction*5));paintPreview();pulse($(direction<0?'side-previous':'side-next'));return;}navigate(state.target+direction,direction);}
function closeMenu(restoreFocus=true){const wasOpen=tv.classList.contains('menu-open');tv.classList.remove('menu-open');$('menu-toggle').setAttribute('aria-expanded','false');updateNavInert();if(wasOpen&&restoreFocus)$('menu-toggle').focus();}
function updateNavInert(){$('nav').inert=mobile.matches&&!tv.classList.contains('menu-open');}
function toggleMenu(){if(!state.powered)return;const open=tv.classList.toggle('menu-open');$('menu-toggle').setAttribute('aria-expanded',String(open));updateNavInert();if(open)$('menu-close').focus();}
function setPower(on){
state.powered=on;state.token++;state.busy=false;tv.classList.remove('tuning','booting');tv.classList.toggle('powered-off',!on);screen.classList.toggle('is-off',!on);$('screen-content').inert=!on;viewport.setAttribute('aria-busy','false');$('power').setAttribute('aria-pressed',String(on));$('power').setAttribute('aria-label',on?'Turn television off':'Turn television on');$('power').title=on?'Turn television off':'Turn television on';cancelAnimationFrame(noiseFrame);noiseFrame=0;
updateBackgroundMotion();syncMusic();
if(!on){closeSoundSettings(false);cancelAnimationFrame(previewFrame);state.playing=false;closeMenu(false);$('announcement').textContent='Television off';return;}
render(state.target);if(!reduced.matches){const bootToken=state.token;tv.classList.add('booting','tuning');startSnow(470);setTimeout(()=>{if(bootToken===state.token)tv.classList.remove('tuning');},350);setTimeout(()=>{if(bootToken===state.token)tv.classList.remove('booting');},650);}
$('announcement').textContent='Television on. '+TITLES[PAGES[state.current]];
}
document.addEventListener('click',event=>{const b=event.target.closest('[data-page]');if(b){const i=PAGES.indexOf(b.dataset.page);navigate(i,i>=state.target?1:-1);}});
$('next').addEventListener('click',()=>step(1));$('previous').addEventListener('click',()=>step(-1));$('side-next').addEventListener('click',()=>step(1));$('side-previous').addEventListener('click',()=>step(-1));
$('channel-knob').addEventListener('click',e=>{const d=e.shiftKey?-1:1;navigate(state.target+d,d);});
let wheelAmount=0,wheelLockedUntil=0;$('channel-knob').addEventListener('wheel',e=>{e.preventDefault();if(performance.now()<wheelLockedUntil)return;wheelAmount+=e.deltaY;if(Math.abs(wheelAmount)>30){const d=wheelAmount>0?1:-1;navigate(state.target+d,d);wheelAmount=0;wheelLockedUntil=performance.now()+500;}},{passive:false});
$('volume-knob').addEventListener('click',toggleMusic);
$('power').addEventListener('click',()=>setPower(!state.powered));$('menu-toggle').addEventListener('click',toggleMenu);$('menu-close').addEventListener('click',()=>closeMenu());
screen.addEventListener('click',e=>{if(tv.classList.contains('menu-open')&&!e.target.closest('.nav')&&!e.target.closest('#menu-toggle'))closeMenu();});
page.addEventListener('click',e=>{if(e.target.closest('#play-pause'))togglePreview();});
page.addEventListener('input',e=>{if(e.target.id==='preview-seek'){state.playhead=Number(e.target.value);paintPreview();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.playing)togglePreview(false);updateBackgroundMotion();syncMusic();});
document.addEventListener('keydown',e=>{if(e.altKey||e.metaKey||e.ctrlKey)return;if(e.key==='Escape'){closeSoundSettings();closeMenu();}if(tv.classList.contains('menu-open')&&e.key==='Tab'){const focusables=[...$('nav').querySelectorAll('button,a[href]')].filter(el=>!el.disabled),first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}return;}if(e.target.matches('input,textarea,select,[contenteditable]'))return;if(e.key===' '&&PAGES[state.current]==='animation'&&!e.target.closest('button,a')){e.preventDefault();togglePreview();}if(e.key==='ArrowRight'){e.preventDefault();step(1);}if(e.key==='ArrowLeft'){e.preventDefault();step(-1);}});
mobile.addEventListener('change',()=>{closeMenu(false);updateNavInert();});
reduced.addEventListener('change',()=>{updateBackgroundMotion();if(reduced.matches){state.token++;state.busy=false;tv.classList.remove('tuning');cancelAnimationFrame(noiseFrame);if(state.powered)render(state.target);viewport.setAttribute('aria-busy','false');}});
// portfolio.json is the editable profile source. The generated snapshot above
// keeps the existing interface usable offline or if a profile request fails.
fetch(new URL('portfolio.json',document.baseURI),{cache:'no-cache'})
.then(response=>{if(!response.ok)throw new Error('Profile unavailable');return response.json();})
.then(data=>{
if(!validProfile(data))throw new Error('Invalid profile');
const changed=['name','studyProgram','photoOriginal'].some(key=>PROFILE[key]!==data[key]);
PROFILE=data;document.querySelector('meta[name="author"]').content=PROFILE.name;$('profile-first-name').textContent=PROFILE.name.trim().split(/\s+/)[0];
if(changed&&state.powered)render(state.current);
})
.catch(()=>{/* Keep the generated snapshot and all TV controls available. */});
render(0);updateNavInert();document.title=originalTitle();setPower(false);setTimeout(()=>setPower(true),180);
</script>
